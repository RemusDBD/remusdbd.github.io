name: Materialize hero media

on:
  push:
    branches:
      - feat/hero-video-background
    paths:
      - 'assets/video/materialize-trigger.txt'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decode hero background media
        run: |
          set -euo pipefail
          if [ -f assets/video/hero-loop.mp4.b64.001 ]; then
            cat assets/video/hero-loop.mp4.b64.* > /tmp/hero-loop.mp4.b64
            base64 --decode /tmp/hero-loop.mp4.b64 > assets/video/hero-loop.mp4
            rm -f assets/video/hero-loop.mp4.b64.*
          fi
          if [ -f assets/img/hero-poster.jpg.b64 ]; then
            base64 --decode assets/img/hero-poster.jpg.b64 > assets/img/hero-poster.jpg
            rm -f assets/img/hero-poster.jpg.b64
          fi
          rm -f assets/video/materialize-trigger.txt .github/workflows/materialize-hero-media.yml
          ls -l assets/video assets/img
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "assets: add hero background video and poster"
          git push origin "HEAD:${{ github.ref_name }}"
